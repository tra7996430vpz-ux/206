<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>81Prime</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ============================================================
       THEME — Style #6: Glassmorphism (deterministic, fixed)
       ============================================================ */
    :root {
      --bg-gradient: linear-gradient(160deg, #e8eef7 0%, #d4e0f0 50%, #e2e8f5 100%);
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.75);
      --glass-shadow: 0 8px 32px rgba(31, 56, 102, 0.10);
      --glass-blur: blur(16px) saturate(1.4);
      --primary: #2e5cff;
      --primary-light: #6b8cff;
      --text: #1a2744;
      --text-secondary: #5a6a8a;
      --up: #e8503a;
      --down: #1e9e6a;
      --radius: 16px;
      --radius-sm: 10px;
      --space: 16px;
      --space-sm: 8px;
      --space-lg: 24px;
      --tab-height: 60px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      overflow: hidden;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* ---- Scroll container ---- */
    .page-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: var(--space);
      padding-top: calc(var(--space) + env(safe-area-inset-top, 0px));
    }

    .page-scroll.no-tab {
      padding-bottom: calc(var(--space) + env(safe-area-inset-bottom, 0px));
    }

    .page-scroll.with-tab {
      padding-bottom: calc(var(--tab-height) + var(--space) + env(safe-area-inset-bottom, 0px));
    }

    /* ---- Glass card ---- */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
    }

    /* ---- Transition ---- */
    .fade-slide-enter-active,
    .fade-slide-leave-active {
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .fade-slide-enter-from {
      opacity: 0;
      transform: translateY(12px);
    }
    .fade-slide-leave-to {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* ---- Tab bar ---- */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: var(--tab-height);
      display: flex;
      align-items: stretch;
      background: rgba(255,255,255,0.62);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-top: 1px solid var(--glass-border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 100;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      min-height: 44px;
      transition: color 0.18s;
      position: relative;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab-item.active {
      color: var(--primary);
    }

    .tab-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      width: 24px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--primary);
    }

    /* ---- Header ---- */
    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-lg);
      padding-top: var(--space-sm);
    }

    .back-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      cursor: pointer;
      flex-shrink: 0;
      color: var(--text);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
    }

    /* ---- Section ---- */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.12s;
      background: var(--primary);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.88;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    /* ---- Inputs ---- */
    .input-field {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(46, 92, 255, 0.20);
      background: rgba(255,255,255,0.60);
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      font-family: inherit;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46, 92, 255, 0.12);
    }

    .input-field::placeholder {
      color: #9aa8c0;
    }

    textarea.input-field {
      resize: vertical;
      min-height: 100px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .field-group {
      margin-bottom: var(--space);
    }

    /* ---- Stock list ---- */
    .stock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-height: 44px;
    }

    .stock-item:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(31,56,102,0.06);
    }

    .stock-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stock-symbol {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
    }

    .stock-name {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stock-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .stock-price {
      font-weight: 700;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .stock-change {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .up { color: var(--up); }
    .down { color: var(--down); }

    /* ---- Feature grid ---- */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: var(--space-lg);
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 6px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s;
      min-height: 44px;
    }

    .feature-item:active {
      transform: scale(0.95);
    }

    .feature-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(46,92,255,0.15), rgba(107,140,255,0.08));
    }

    .feature-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature-label {
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
      color: var(--text-secondary);
    }

    /* ---- Brand header ---- */
    .brand-header {
      text-align: center;
      padding: var(--space-lg) var(--space);
      margin-bottom: var(--space);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(46,92,255,0.10), rgba(107,140,255,0.04));
      border: 1px solid var(--glass-border);
    }

    .brand-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary), #7a9bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ---- Tool card ---- */
    .tool-card {
      padding: var(--space);
      margin-bottom: var(--space);
      border-radius: var(--radius);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .tool-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .tool-result {
      padding: 12px;
      border-radius: var(--radius-sm);
      background: rgba(46,92,255,0.06);
      border: 1px solid rgba(46,92,255,0.12);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      margin-top: var(--space-sm);
    }

    .tool-result strong {
      color: var(--primary);
    }

    /* ---- Calendar ---- */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: var(--space-sm);
    }

    .cal-header {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 4px 0;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      position: relative;
      min-height: 36px;
    }

    .cal-day.today {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .cal-day.checked {
      background: rgba(46,92,255,0.15);
      color: var(--primary);
      font-weight: 700;
    }

    .cal-day.empty {
      color: transparent;
    }

    .cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      position: absolute;
      bottom: 4px;
    }

    .cal-day.today .cal-dot {
      background: #fff;
    }

    /* ---- Settings list ---- */
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px var(--space);
      min-height: 52px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      transition: background 0.12s;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
    }

    .settings-item:last-child {
      border-bottom: none;
    }

    .settings-item:active {
      background: rgba(46,92,255,0.06);
    }

    .settings-item svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-height) + 24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26,39,68,0.92);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }

    /* ---- Modal ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space);
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      max-height: 70vh;
      overflow-y: auto;
      padding: var(--space-lg);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    }

    .modal-content h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .modal-content p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    /* ---- Loading ---- */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 24px;
      padding: var(--space);
      background: var(--bg-gradient);
      padding-top: calc(var(--space) + env(safe-area-inset-top, 0px));
      padding-bottom: calc(var(--space) + env(safe-area-inset-bottom, 0px));
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), #7a9bff);
      box-shadow: 0 8px 32px rgba(46,92,255,0.30);
    }

    .loading-logo svg {
      width: 44px;
      height: 44px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .loading-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .loading-bar-track {
      width: 160px;
      height: 4px;
      border-radius: 2px;
      background: rgba(46,92,255,0.12);
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 30%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--primary), #7a9bff);
      animation: loadingPulse 1.4s ease-in-out infinite;
    }

    @keyframes loadingPulse {
      0% { width: 15%; margin-left: 0; }
      50% { width: 50%; margin-left: 30%; }
      100% { width: 15%; margin-left: 85%; }
    }

    /* ---- Chart ---- */
    .chart-wrap {
      width: 100%;
      padding: var(--space-sm) 0;
      overflow: hidden;
    }

    .chart-wrap svg {
      width: 100%;
      height: 180px;
      display: block;
    }

    /* ---- Detail header ---- */
    .detail-price-block {
      text-align: center;
      padding: var(--space-lg) 0;
    }

    .detail-price {
      font-size: 36px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .detail-change {
      font-size: 16px;
      font-weight: 700;
      margin-top: 4px;
    }

    /* ---- Empty / misc ---- */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .text-sm { font-size: 13px; }
    .text-xs { font-size: 11px; }
    .text-secondary { color: var(--text-secondary); }
    .mt-sm { margin-top: var(--space-sm); }
    .mt { margin-top: var(--space); }
    .mb { margin-bottom: var(--space); }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .gap-sm { gap: var(--space-sm); }

    /* ---- Article ---- */
    .article-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: var(--space-sm);
    }

    .article-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: var(--space);
    }

    .article-body p {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-secondary);
      margin-bottom: var(--space);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /* ============================================================
       HOW TO ADD A NEW PAGE
       ============================================================
       1. Define a component object with a `template` and optional `setup`.
       2. Add a route entry in `routes` array with `path`, `component`, and `meta`.
       3. If it's a main tab page, add a <router-link> in the TabBar
          component's template and ensure route has `meta.tab: true`.
       ============================================================ */

    // ==================== 1. DATA ====================
    const STOCKS = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 189.84 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 374.58 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 141.52 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.22 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 495.22 },
      { symbol: 'META', name: 'Meta Platforms Inc.', price: 505.95 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 248.50 },
      { symbol: 'BRK.B', name: 'Berkshire Hathaway', price: 362.40 },
      { symbol: 'JPM', name: 'JPMorgan Chase & Co.', price: 196.35 },
      { symbol: 'V', name: 'Visa Inc.', price: 279.30 },
      { symbol: 'UNH', name: 'UnitedHealth Group', price: 524.18 },
      { symbol: 'HD', name: 'Home Depot Inc.', price: 342.78 },
      { symbol: 'PG', name: 'Procter & Gamble', price: 158.92 },
      { symbol: 'MA', name: 'Mastercard Inc.', price: 453.60 },
      { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.45 },
      { symbol: 'PYPL', name: 'PayPal Holdings', price: 62.88 },
      { symbol: 'NFLX', name: 'Netflix Inc.', price: 628.35 },
      { symbol: 'INTC', name: 'Intel Corp.', price: 43.10 },
      { symbol: 'AMD', name: 'Advanced Micro Devices', price: 178.90 },
      { symbol: 'CRM', name: 'Salesforce Inc.', price: 298.45 },
      { symbol: 'BA', name: 'Boeing Co.', price: 212.60 },
      { symbol: 'KO', name: 'Coca-Cola Co.', price: 60.12 },
      { symbol: 'PEP', name: 'PepsiCo Inc.', price: 172.30 },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 68.45 },
      { symbol: 'XOM', name: 'Exxon Mobil Corp.', price: 104.20 },
    ];

    // Generate deterministic change values
    function seededChange(symbol) {
      let h = 0;
      for (let i = 0; i < symbol.length; i++) {
        h = ((h << 5) - h) + symbol.charCodeAt(i);
        h |= 0;
      }
      const pct = ((Math.abs(h) % 1000) / 1000 - 0.5) * 8;
      return Math.round(pct * 100) / 100;
    }

    const STOCKS_WITH_CHANGE = STOCKS.map(s => {
      const chg = seededChange(s.symbol);
      return { ...s, change: chg, changeAbs: Math.round(s.price * chg / 100 * 100) / 100 };
    });

    // Generate 30-day price history deterministically
    function genHistory(symbol, basePrice) {
      let seed = 0;
      for (let i = 0; i < symbol.length; i++) seed += symbol.charCodeAt(i) * (i + 1);
      const days = 30;
      const pts = [];
      for (let i = 0; i < days; i++) {
        seed = (seed * 9301 + 49297) % 233280;
        const r = seed / 233280;
        const noise = (r - 0.5) * basePrice * 0.04;
        const trend = (i / days - 0.5) * basePrice * 0.02;
        pts.push(Math.round((basePrice + noise + trend) * 100) / 100);
      }
      return pts;
    }

    // Feature entries — randomly pick 4 at generation time

        const padTop = 16;
        const padBot = 16;
        const min = Math.min(...history);
        const max = Math.max(...history);
        const range = max - min || 1;
        const drawH = chartH - padTop - padBot;

        const points = history.map((p, i) => {

          const y = padTop + (1 - (p - min) / range) * drawH;
          return { x, y };

          if (r === 0) return (loan.amount / n).toFixed(2);
          const p = loan.amount * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
          return p.toFixed(2);
        });
        const totalPayment = Vue.computed(() => (parseFloat(monthlyPayment.value) * loan.years * 12).toFixed(2));
        const totalInterest = Vue.computed(() => (parseFloat(totalPayment.value) - loan.amount).toFixed(2));

        // Profit
        const profit = Vue.reactive({ cost: 10, price: 15, units: 100 });
        const revenue = Vue.computed(() => (profit.price * profit.units).toFixed(2));
        const totalCost = Vue.computed(() => (profit.cost * profit.units).toFixed(2));
        const profitVal = Vue.computed(() => profit.price * profit.units - profit.cost * profit.units);

        // Reverse Yield
        const rev = Vue.reactive({ target: 1000, principal: 10000, years: 1 });
        const annualizedReturn = Vue.computed(() => {
          if (!rev.principal || !rev.years) return '—';
          const r = (Math.pow(1 + rev.target / rev.principal, 1 / rev.years) - 1) * 100;
          return r.toFixed(2) + '%';
        });

        // Password
        const pwd = Vue.reactive({ input: '' });
        const pwdComputed = Vue.computed(() => {
          const v = pwd.input;
          if (!v) return { label: '—', color: '#999', md5: '—' };
          const digest = md5(v);
          let score = 0;
          if (v.length >= 8) score++;
          if (v.length >= 12) score++;
          if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
          if (/\d/.test(v)) score++;
          if (/[^a-zA-Z0-9]/.test(v)) score++;
          if (score <= 2) return { label: 'Weak', color: '#e8503a', md5: digest };
          if (score <= 3) return { label: 'Fair', color: '#f0a030', md5: digest };
          return { label: 'Strong', color: '#1e9e6a', md5: digest };
        });
        Vue.watchEffect(() => { pwd.label = pwdComputed.value.label; pwd.color = pwdComputed.value.color; pwd.md5 = pwdComputed.value.md5; });

        // Credit Memo
        const memo = Vue.reactive({ name: '', amount: 0, dueDate: '' });
        const memos = Vue.ref([]);
        function saveMemo() {
          if (!memo.name || !memo.dueDate) return;
          const diff = Math.ceil((new Date(memo.dueDate) - new Date()) / 86400000);
          memos.value.push({ name: memo.name, amount: memo.amount, dueDate: memo.dueDate, daysLeft: Math.max(0, diff) });
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            new Notification('Credit Reminder', { body: `${memo.name} — ${memo.amount}` });
          } else if (typeof Notification !== 'undefined' && Notification.permission !== 'denied') {
            Notification.requestPermission();
          }
          memo.name = ''; memo.amount = 0; memo.dueDate = '';
        }

        return {
          dca, takeProfitPrice, targetValue, gain,
          cal, daysToMaturity,
          loan, monthlyPayment, totalPayment, totalInterest,
          profit, revenue, totalCost, profitVal,
          rev, annualizedReturn,
          pwd,
          memo, memos, saveMemo,
        };
      }
    };

    const CheckinPage = {

        <div class="page-scroll no-tab">
          <div class="page-header">
            <button class="back-btn" @click="$router.back()" v-html="backIcon"></button>
            <div class="page-title">Monthly Check-in</div>

          <div class="glass" style="padding:20px;">

              {{ monthName }} {{ year }}
            </div>

            <div class="calendar-grid">
              <div v-for="d in dayHeaders" :key="'h'+d" class="cal-header">{{ d }}</div>
              <div v-for="(cell, idx) in calendarCells" :key="idx"
                   class="cal-day"
                   :class="{ 'empty': !cell.day, 'today': cell.isToday, 'checked': cell.checked }">
                <span v-if="cell.day">{{ cell.day }}</span>
                <div v-if="cell.checked" class="cal-dot"></div>
              </div>
            </div>

            <button class="btn" style="width:100%;margin-top:16px;" @click="doCheckin" :disabled="todayChecked">
              {{ todayChecked ? 'Checked In Today' : 'Check In Today' }}
            </button>
          </div>
        </div>
      `,
      setup() {
        const backIcon = icon('arrow-left', 20);
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthName = now.toLocaleString('en', { month: 'long' });
        const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        const STORAGE_KEY = '81prime_checkins';
        const checkedDays = Vue.ref([]);
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) checkedDays.value = JSON.parse(raw);
        } catch (e) {}

        const todayStr = year + '-' + (month + 1) + '-' + now.getDate();
        const todayChecked = Vue.computed(() => checkedDays.value.includes(todayStr));

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push({ day: 0 });
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = year + '-' + (month + 1) + '-' + d;
          cells.push({
            day: d,
            isToday: d === now.getDate(),
            checked: checkedDays.value.includes(ds),
          });
        }
        const calendarCells = Vue.ref(cells);

        function doCheckin() {
          if (todayChecked.value) return;
          checkedDays.value.push(todayStr);
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedDays.value)); } catch (e) {}
          calendarCells.value = calendarCells.value.map(c =>
            c.day === now.getDate() ? { ...c, checked: true } : c
          );
        }

        return { backIcon, monthName, year, dayHeaders, calendarCells, todayChecked, doCheckin };
      }
    };

            <span>Toolbox</span>

          <router-link to="/settings" class="tab-item" :class="{ active: isActive('/settings') }">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

      setup() {

          const path = route.path;
          if (path === '/loading') return false;
          if (path.startsWith('/stock/') || path.startsWith('/feature/')) return false;
          if (path.startsWith('/settings/') && path !== '/settings') return false;
          return route.meta.tab === true;
        });

        const isActive = (prefix) => route.path === prefix || route.path.startsWith(prefix + '/');

        const toastMsg = Vue.ref('');
        let toastTimer = null;
        function showToast(msg) {
          toastMsg.value = msg;
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { toastMsg.value = ''; }, 2000);
        }

        return { showTab, isActive, toastMsg, showToast };
      }
    };

    const app = Vue.createApp(App);
    app.use(router);
    const vm = app.mount('#app');

    // Expose showToast to child components
    vm.showToast = function (msg) {
      const instance = app._instance;
      if (instance && instance.proxy) {
        // Access the root setup's showToast
        const root = instance.proxy;
        if (root.toastMsg !== undefined) {
          root.toastMsg = msg;
          setTimeout(() => { root.toastMsg = ''; }, 2000);
        }
      }
    };
  </script>
